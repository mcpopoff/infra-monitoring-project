services:
  api:
    image: hashicorp/http-echo:latest
    command: ["-listen=:8080", "-text=Monitoring Service Active"]
    networks:
      - monitoring-net
    restart: unless-stopped
    
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - monitoring-net
    restart: unless-stopped
    
networks:
  monitoring-net:
    driver: bridge
